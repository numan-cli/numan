name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string
      draft:
        description: "Create as draft release"
        required: false
        default: true
        type: boolean
      crates_only:
        description: "Only publish the crate for an existing tag (skip rebuild / GitHub Release)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  checks: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-ci:
    name: Wait for green CI
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI checks to be registered
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          repo="${{ github.repository }}"
          pattern='^(Test \(.*\)|Clippy|Format|MSRV \(1\.88\)|Package|Deny|Real-Nu acceptance \(.*\))$'
          echo "Waiting for CI checks to be registered for $sha..."
          for i in $(seq 1 40); do
            names=$(gh api "repos/${repo}/commits/${sha}/check-runs" --jq '.check_runs[].name')
            if echo "$names" | grep -Eq "$pattern"; then
              echo "Found matching checks:"
              echo "$names" | grep -E "$pattern"
              exit 0
            fi
            echo "No matching checks yet (attempt $i/40); sleeping 15s..."
            sleep 15
          done
          echo "::error::Timed out waiting for CI checks to be registered on ${sha}"
          exit 1

      - name: Wait for CI checks on tagged commit
        uses: lewagon/wait-on-check-action@2271c86c146b96545b4e871b855e10ffa6f50773 # v1.9.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}
          wait-interval: 30
          allowed-conclusions: success
          check-regexp: ^(Test \(.*\)|Clippy|Format|MSRV \(1\.88\)|Package|Deny|Real-Nu acceptance \(.*\))$

  preflight:
    name: Release preflight
    needs: [verify-ci]
    if: >-
      ${{ !cancelled()
      && (needs.verify-ci.result == 'success' || needs.verify-ci.result == 'skipped')
      && (github.event_name != 'workflow_dispatch' || inputs.crates_only != true) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Package manifest
        run: cargo package --locked

  build:
    name: Build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: numan
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin_name: numan
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: numan.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bin_name: numan.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: numan

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release version
        id: meta
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${INPUT_TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip "target/${{ matrix.target }}/release/${{ matrix.bin_name }}"

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          artifact="numan-${{ steps.meta.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$artifact"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$artifact/"
          chmod +x "$artifact/${{ matrix.bin_name }}"
          tar -czf "${artifact}.tar.gz" "$artifact"
          echo "artifact=${artifact}.tar.gz" >> "$GITHUB_ENV"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifact = "numan-${{ steps.meta.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$artifact/"
          Compress-Archive -Path $artifact -DestinationPath "$artifact.zip" -Force
          echo "artifact=$artifact.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ env.artifact }}
          retention-days: 3

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release tag
        id: meta
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum numan-* > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS for self-update
        working-directory: dist
        env:
          NUMAN_RELEASE_SIGNING_KEY: ${{ secrets.NUMAN_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${NUMAN_RELEASE_SIGNING_KEY}" ]]; then
            echo "::error::NUMAN_RELEASE_SIGNING_KEY is unset. Refusing to publish: \
          standalone numan update --self requires SHA256SUMS.sig on every release."
            exit 1
          fi
          python3 -m pip install --user pynacl
          python3 "${GITHUB_WORKSPACE}/scripts/sign-sha256sums.py" SHA256SUMS SHA256SUMS.sig
          cat SHA256SUMS.sig

      - name: Prepare release notes from CHANGELOG
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: bash scripts/release-notes-from-changelog.sh "$RELEASE_TAG" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          generate_release_notes: false
          body_path: release-notes.md
          files: dist/*

      # Stable producer/consumer contract for winget.yml (do not rename this artifact).
      - name: Emit WinGet release marker
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p winget-marker
          printf '%s\n' "$RELEASE_TAG" > winget-marker/release-tag.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: winget-release-ready
          path: winget-marker/
          retention-days: 3

      # Stable producer/consumer contract for homebrew.yml (do not rename this artifact).
      - name: Emit Homebrew release marker
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p homebrew-marker
          printf '%s\n' "$RELEASE_TAG" > homebrew-marker/release-tag.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-release-ready
          path: homebrew-marker/
          retention-days: 3

  publish-crate:
    name: Publish to crates.io
    needs: [preflight, release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Authenticate with crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Retries crates.io publish for an already-cut tag (e.g. after Trusted Publishing
  # was enabled). Does not rebuild release assets. Requires crates.io Trusted
  # Publishing for workflow filename `release.yml`.
  publish-crate-existing-tag:
    name: Publish existing tag to crates.io
    if: github.event_name == 'workflow_dispatch' && inputs.crates_only == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Verify Cargo.toml version matches tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          actual="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Cargo.toml version ${actual} does not match tag ${RELEASE_TAG}"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Authenticate with crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
