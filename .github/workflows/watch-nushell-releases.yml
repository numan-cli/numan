name: Watch Nushell Releases

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  watch-release:
    name: Check Nushell Releases
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Nushell release watcher
        id: watcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/watch_nu_releases.py --write

      - name: Open Tracking PR and Enable Auto-Merge
        if: steps.watcher.outputs.is_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.watcher.outputs.version }}
          NEW_VERSIONS: ${{ steps.watcher.outputs.new_versions }}
          BLOG_URL: ${{ steps.watcher.outputs.blog_url }}
          GITHUB_URL: ${{ steps.watcher.outputs.github_url }}
        run: |
          BRANCH="feat/nu-release-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check for an existing PR first. Preserve its branch and sync only
          # the generated release files when it is missing detected releases.
          EXISTING_PR=$(gh pr list --head "${BRANCH}" --state open --json url --jq '.[0].url // empty')
          if [ -n "${EXISTING_PR}" ]; then
            echo "PR already exists for ${BRANCH}: ${EXISTING_PR}; checking its release entries."
            PR_URL="${EXISTING_PR}"
            RELEASE_SNAPSHOT=$(mktemp -d)
            cp .github/latest-nu-version.json "${RELEASE_SNAPSHOT}/latest-nu-version.json"
            cp docs/nushell-releases.md "${RELEASE_SNAPSHOT}/nushell-releases.md"

            git fetch origin "${BRANCH}"
            REMOTE_HEAD=$(git rev-parse FETCH_HEAD)
            BRANCH_VERSION=$(git show "${REMOTE_HEAD}:.github/latest-nu-version.json" | python -c 'import json, sys; print(json.load(sys.stdin).get("latest_version", ""))')
            NEEDS_PR_UPDATE=false
            if [ "${BRANCH_VERSION}" != "${VERSION}" ]; then
              NEEDS_PR_UPDATE=true
            fi
            IFS=',' read -r -a DETECTED_VERSIONS <<< "${NEW_VERSIONS}"
            for DETECTED_VERSION in "${DETECTED_VERSIONS[@]}"; do
              if [ -n "${DETECTED_VERSION}" ] && ! git show "${REMOTE_HEAD}:docs/nushell-releases.md" | grep -Fq "## Nushell ${DETECTED_VERSION} ("; then
                NEEDS_PR_UPDATE=true
              fi
            done

            if [ "${NEEDS_PR_UPDATE}" = true ]; then
              git checkout --force -B "${BRANCH}" "${REMOTE_HEAD}"
              cp "${RELEASE_SNAPSHOT}/latest-nu-version.json" .github/latest-nu-version.json
              cp "${RELEASE_SNAPSHOT}/nushell-releases.md" docs/nushell-releases.md
              git add -- .github/latest-nu-version.json docs/nushell-releases.md
              git commit -m "feat(release): catch up official Nushell releases through ${VERSION}"
              # Push without force so a concurrent maintainer update is preserved.
              git push origin "${BRANCH}"
              echo "Updated ${EXISTING_PR} with releases: ${NEW_VERSIONS}"
            else
              echo "Existing PR already contains all detected releases; no branch update needed."
            fi
          else
            git checkout -b "${BRANCH}"
            git add .github/latest-nu-version.json docs/nushell-releases.md
            git commit -m "feat(release): track official Nushell ${VERSION} release"
            git push origin "${BRANCH}"

            PR_BODY=$(cat <<EOF
          ## Official Nushell ${VERSION} Released

          Releases detected since last check: ${NEW_VERSIONS}

          A new official Nushell release has been published.

          - **Release Notes**: ${GITHUB_URL}
          - **Changelog / Blog**: ${BLOG_URL}

          ### Ecosystem Checklist
          - [ ] Review breaking engine/protocol changes affecting plugins
          - [ ] Audit \`numan-maintained/*\` fork dependencies (\`Cargo.toml\`)
          - [ ] Update \`manifest.json\` active plugin versions in \`numan-plugins\`
          - [ ] Rebuild & test active plugins for Nu ${VERSION} band
          - [ ] Update \`numan\` CI acceptance matrix (\`.github/workflows/ci.yml\`)

          _Automated by \`.github/workflows/watch-nushell-releases.yml\`._
          EOF
            )

            PR_URL=$(gh pr create \
              --title "feat(release): track official Nushell ${VERSION} release" \
              --body "${PR_BODY}" \
              --head "${BRANCH}" \
              --base master)
            echo "Created PR: ${PR_URL}"
          fi

          # Enable auto-merge
          gh pr merge "${PR_URL}" --auto --squash || echo "Auto-merge could not be enabled; manual merge required."
