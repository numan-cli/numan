name: Trigger Kiro Crew

on:
  push:
    branches: [master]
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  trigger:
    if: >
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/kirocrew') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    uses: tonythethompson/.github/.github/workflows/kiro-crew-trigger.yml@main
    with:
      daytona_os: linux
      one_off_instruction: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
    secrets: inherit
