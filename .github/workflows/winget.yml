name: Publish to WinGet

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to submit (for example, v0.1.5)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Submit manifest update
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Publish manifest to WinGet
        uses: vedantmgoyal9/winget-releaser@b3a5dae0047c6180023acba3f548c55fdf6b7193
        with:
          identifier: tonythethompson.numan
          fork-user: tonythethompson
          installers-regex: '\.zip$'
          release-tag: ${{ inputs.release_tag || github.event.workflow_run.head_branch }}
          token: ${{ secrets.WINGET_TOKEN }}
