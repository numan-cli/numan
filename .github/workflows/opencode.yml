---
name: OpenCode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        required: true
        type: string
        description: Prompt for OpenCode

concurrency:
  group: opencode-bot-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  opencode:
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains('OWNER,MEMBER,COLLABORATOR,CONTRIBUTOR', github.event.comment.author_association)
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    uses: tonythethompson/opencode-review-threads/.github/workflows/opencode-bot.yml@e23b9ffded084693525c8b8caa62dd8d9e2b4f41 # v1.3.2
    with:
      prompt: ${{ inputs.prompt }}
      use-github-token: true
      timeout-minutes: 85
      models-review: >-
        cf:@cf/zai-org/glm-5.2,
        cf:@cf/deepseek-ai/deepseek-v4-pro-0813,
        zen:big-pickle,
        zen:nemotron-3-ultra-free
      models-fix: >-
        cf:@cf/deepseek-ai/deepseek-v4-flash-0731,
        zen:nemotron-3.5-lightning-free,
        zen:big-pickle,
        zen:nemotron-3-ultra-free,
        zen:deepseek-v4-flash
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY || secrets.CLOUDFLARE_API_TOKEN }}
      CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
