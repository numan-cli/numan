name: CI

on:
  push:
    branches: [master, main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo test --verbose
      - run: cargo build --verbose

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo clippy -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  roadmap-drift:
    name: Roadmap drift
    runs-on: ubuntu-latest
    env:
      # Roadmap contract v1 pin. The tag itself is the canonical
      # reference; bumping it is a coordinated operation across all
      # three repos. See scripts/bump-contract.sh. The verify step
      # below fails closed if the tag moves; the diff step fails
      # closed if numan's local copy drifts.
      CONTRACT_TAG: numan-roadmap-contract/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify pinned contract tag exists
        run: |
          curl --fail-with-body --silent --show-error \
            https://api.github.com/repos/tonythethompson/numan/git/refs/tags/$CONTRACT_TAG \
            | python -c "import sys,json; o=json.load(sys.stdin); print('OK: ' + o['object']['sha'] + ' resolves ' + sys.argv[1])" $CONTRACT_TAG
      - name: Fetch consolidated roadmap from pin (numan@$CONTRACT_TAG)
        run: |
          curl --fail-with-body --silent --show-error --location \
            https://raw.githubusercontent.com/tonythethompson/numan/$CONTRACT_TAG/docs/plans/consolidated-multi-repo-roadmap.md \
            -o /tmp/consolidated-roadmap.md
          diff -u docs/plans/consolidated-multi-repo-roadmap.md /tmp/consolidated-roadmap.md \
            || (echo "::error::Local consolidated roadmap diverges from $CONTRACT_TAG."; \
                echo "Run scripts/bump-contract.sh and ship a coordinated bump PR."; \
                exit 1)
      - name: Fetch drift script from pin (numan@$CONTRACT_TAG)
        run: |
          curl --fail-with-body --silent --show-error --location \
            https://raw.githubusercontent.com/tonythethompson/numan/$CONTRACT_TAG/scripts/check-roadmap-drift.py \
            -o /tmp/check-roadmap-drift.py
          diff -u scripts/check-roadmap-drift.py /tmp/check-roadmap-drift.py \
            || (echo "::error::Local drift script diverges from $CONTRACT_TAG."; \
                echo "Bump the contract before changing the drift script."; \
                exit 1)
      - name: Run drift check against consolidated roadmap
        run: python scripts/check-roadmap-drift.py
      - name: Mirror to numan-plugins/numan-registry
        run: |
          # CI intentionally also runs against this PR's siblings when
          # those repos pass CONSOLIDATED_ROADMAP via workflow_call; the
          # numan job here is the canonical reference build.
          echo "see https://github.com/tonythethompson/numan-plugins and https://github.com/tonythethompson/numan-registry for mirrors"

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo +1.88 check --locked --all-targets

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo package --locked

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2

  real-nu-acceptance:
    name: Real-Nu acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' }}
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.113"
      - run: nu --version
      # Stage 1 and the active-plugin update matrix are production/fixture
      # acceptance suites owned by workflow_dispatch jobs. Keep this matrix on
      # the portable ignored tests only.
      - run: cargo test --verbose -- --ignored --skip acceptance_process_helper --skip stage1_official_registry --skip real_nu_active_update_
