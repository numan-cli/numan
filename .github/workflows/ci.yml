name: CI

on:
  push:
    branches: [master, main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo test --verbose
      - run: cargo build --verbose

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo clippy -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' }}
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-llvm-cov
      # Informational only: continue-on-error means neither a low-coverage
      # number nor cargo llvm-cov itself exiting nonzero (e.g. a test fails
      # during this instrumented run) can fail the build. The `test` job
      # already runs the full hermetic suite and gates on real test failures;
      # this job exists purely to publish the coverage summary.
      - name: Run coverage
        continue-on-error: true
        run: |
          {
            echo "### Coverage summary"
            echo '```'
            cargo llvm-cov --workspace --locked --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  roadmap-drift:
    name: Roadmap drift
    runs-on: ubuntu-latest
    env:
      # Roadmap contract v1 pin. CONTRACT_TAG is the human-readable handle;
      # CONTRACT_SHA is the immutable fetch target. The verify step fails
      # closed if the tag moves away from this SHA. See scripts/bump-contract.sh.
      CONTRACT_TAG: numan-roadmap-contract/v2
      CONTRACT_SHA: 14f8e8c0934049c0030626b4a0d917255e988105
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned SHA still resolves to tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref_file=$(mktemp)
          status=$(curl --silent --show-error --output "$ref_file" --write-out "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: numan-ci" \
            "https://api.github.com/repos/numan-cli/numan/git/refs/tags/${CONTRACT_TAG}")
          if [ "$status" = "404" ]; then
            echo "::warning::Tag $CONTRACT_TAG does not exist yet; skipping SHA resolution check."
            exit 0
          fi
          if [ "$status" != "200" ]; then
            echo "::error::GitHub API returned HTTP $status for tag $CONTRACT_TAG."
            cat "$ref_file"
            exit 1
          fi
          object_type=$(jq -r '.object.type' "$ref_file")
          tagged_sha=$(jq -r '.object.sha' "$ref_file")
          if [ "$object_type" = "tag" ]; then
            tagged_sha=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: numan-ci" \
              "$(jq -r '.object.url' "$ref_file")" \
              | jq -r '.object.sha')
          fi
          if [ "$tagged_sha" != "$CONTRACT_SHA" ]; then
            echo "::error::Tag $CONTRACT_TAG resolves to $tagged_sha but CONTRACT_SHA=$CONTRACT_SHA."
            echo "Run scripts/bump-contract.sh to coordinate the bump across all three repos."
            exit 1
          fi
          echo "OK: $CONTRACT_TAG pinned to $CONTRACT_SHA"
      - name: Fetch consolidated roadmap from pin (numan@${{ env.CONTRACT_SHA }})
        run: |
          curl --fail-with-body --silent --show-error --location \
            https://raw.githubusercontent.com/numan-cli/numan/$CONTRACT_SHA/docs/plans/consolidated-multi-repo-roadmap.md \
            -o /tmp/consolidated-roadmap.md
          diff -u docs/plans/consolidated-multi-repo-roadmap.md /tmp/consolidated-roadmap.md \
            || (echo "::error::Local consolidated roadmap diverges from $CONTRACT_SHA."; \
                echo "Run scripts/bump-contract.sh and ship a coordinated bump PR."; \
                exit 1)
      - name: Fetch drift script from pin (numan@${{ env.CONTRACT_SHA }})
        run: |
          curl --fail-with-body --silent --show-error --location \
            https://raw.githubusercontent.com/numan-cli/numan/$CONTRACT_SHA/scripts/check-roadmap-drift.py \
            -o /tmp/check-roadmap-drift.py
          diff -u scripts/check-roadmap-drift.py /tmp/check-roadmap-drift.py \
            || (echo "::error::Local drift script diverges from $CONTRACT_SHA."; \
                echo "Bump the contract before changing the drift script."; \
                exit 1)
      - name: Fetch contract doc from pin (numan@${{ env.CONTRACT_SHA }})
        run: |
          curl --fail-with-body --silent --show-error --location \
            https://raw.githubusercontent.com/numan-cli/numan/$CONTRACT_SHA/docs/contracts/roadmap-v1.md \
            -o /tmp/roadmap-v1.md
          diff -u docs/contracts/roadmap-v1.md /tmp/roadmap-v1.md \
            || (echo "::error::Local contract doc diverges from $CONTRACT_SHA."; \
                echo "Bump the contract before changing docs/contracts/roadmap-v1.md."; \
                exit 1)
      - name: Run drift check against consolidated roadmap
        run: python3 scripts/check-roadmap-drift.py
      - name: Sibling repository pointers
        run: |
          # Sibling repos (numan-plugins, numan-registry) run their own
          # roadmap-drift workflows against the same CONTRACT_SHA pin.
          # This step only documents those repositories; it does not
          # invoke a cross-repo workflow_call. Install drop-ins from
          # cross-repo-mirror/ (see README.md) or scripts/bump-contract.sh.
          echo "see https://github.com/numan-cli/numan-plugins and https://github.com/numan-cli/numan-registry for mirrors"

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo +1.88 check --locked --all-targets

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo package --locked

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2

  script-tests:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts

  real-nu-acceptance:
    name: Real-Nu acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' }}
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.115.0"
      - run: nu --version
      # Stage 1 and the active-plugin update matrix are production/fixture
      # acceptance suites owned by workflow_dispatch jobs. Keep this matrix on
      # the portable ignored tests only.
      - run: cargo test --verbose -- --ignored --skip acceptance_process_helper --skip stage1_official_registry --skip real_nu_active_update_
